name: Build Dahan Empire

on:
  push:
    paths:
      - "dahan/**"
      - ".github/workflows/dahan-build.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dahan
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dahan/package.json
      - name: Install
        run: npm install
      - name: Build EXE
        run: npm run dist
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Dahan-Empire-Windows
          path: dahan/dist/*.exe
